<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 512" width="100%" height="100%">
  <rect width="1024" height="512" fill="#131518" rx="24"/>
  
  <!-- ICON: The Stepped Waypoint -->
  <g id="icon" transform="translate(140, 156)">
    <!-- Baseline frame anchor -->
    <rect x="0" y="0" width="200" height="200" rx="32" fill="#1A1D23" stroke="#2B303A" stroke-width="2"/>
    
    <!-- Quadrant 1 (Ivory / Elephant Bone): Origin Point -->
    <path d="M 60 70 L 105 70 A 35 35 0 0 1 140 105 L 140 140 L 95 140 A 35 35 0 0 1 60 105 Z" fill="#F5F2EB"/>
    
    <!-- Quadrant 2 (Light Coffee / Warm Taupe): Shifted Waypoint -->
    <path d="M 105 105 L 150 105 A 35 35 0 0 1 185 140 L 185 175 L 140 175 A 35 35 0 0 1 105 140 Z" fill="#D4C5B3"/>
    
    <!-- Vector displacement notch in center -->
    <circle cx="105" cy="105" r="7" fill="#131518"/>
    <circle cx="140" cy="140" r="7" fill="#131518"/>
    <line x1="105" y1="105" x2="140" y2="140" stroke="#131518" stroke-width="3" stroke-linecap="round"/>

    <!-- Geometric cardinal tick -->
    <line x1="100" y1="-12" x2="100" y2="0" stroke="#F5F2EB" stroke-width="3"/>
    <line x1="-12" y1="100" x2="0" y2="100" stroke="#F5F2EB" stroke-width="3"/>
  </g>

  <!-- WORDMARK: GEOSHIFT -->
  <g id="wordmark" transform="translate(420, 260)">
    <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="74" font-weight="700" letter-spacing="4" fill="#F5F2EB">
      GEOSHIFT
    </text>
    <text x="4" y="52" font-family="'SF Mono', 'Menlo', Monaco, monospace" font-size="15" fill="#A89885" letter-spacing="8" font-weight="500">
      CORE LOCATION OVERRIDE
    </text>
  </g>

  <!-- SPECIFICATION BADGE -->
  <g id="tagline" transform="translate(424, 348)">
    <rect x="0" y="0" width="130" height="30" rx="6" fill="#1C1F26" stroke="#2B303A" stroke-width="1"/>
    <text x="14" y="20" font-family="'SF Mono', 'Menlo', Monaco, monospace" font-size="11" fill="#D4C5B3" letter-spacing="2">
      TAURI · RUST
    </text>

    <rect x="142" y="0" width="168" height="30" rx="6" fill="#1C1F26" stroke="#2B303A" stroke-width="1"/>
    <text x="156" y="20" font-family="'SF Mono', 'Menlo', Monaco, monospace" font-size="11" fill="#F5F2EB" letter-spacing="2">
      ZERO PERSISTENCE
    </text>
  </g>
</svg>
